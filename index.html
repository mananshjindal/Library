<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" class="css" />
  </head>
  <body>
    <header>
      <h1>Library</h1>
    </header>
    <main>
      <!-- Add Button -->
      <div class="add-book-container">
        <button class="add-book-button">Add Book</button>
        <dialog class="add-book-dialog">
          <form>
            <input
              id="title"
              name="title"
              type="text"
              placeholder="Title"
              required
            />
            <input
              id="author"
              name="author"
              type="text"
              placeholder="Author"
              required
            />
            <input
              id="pages"
              name="pages"
              type="number"
              placeholder="Pages"
              required
            />
            <div class="checkbox-container">
              <label for="read">Have you read this?</label>
              <input
                name="read"
                type="checkbox"
                id="read"
                value="true"
                checked
              />
            </div>
            <button type="submit" class="dialog-btn-add-book">Add Book</button>
            <button class="cancel">Cancel</button>
          </form>
        </dialog>
      </div>
      <!-- Books Container -->
      <div class="books-container"></div>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
